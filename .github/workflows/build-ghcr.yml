name: build-ghcr

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'out/**'
      - 'Dockerfile'
      - '.github/workflows/build-ghcr.yml'
  workflow_dispatch:

env:
  TEST_TAG: ghcr.io/privau/searxng:test
  GITHUB_LATEST_TAG: ghcr.io/privau/searxng:latest
  DOCKER_HUB_LATEST_TAG: vojkovic/searxng:latest

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check Out Repo
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: vojkovic
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Test Main Image
        uses: docker/build-push-action@v6
        with:
          load: true
          context: ./
          file: ./Dockerfile
          tags: ${{ env.TEST_TAG }}

      - name: Test Main Image
        run: |
          set -euo pipefail

          docker run -d -p 8080:8080 -e AUTHORISED_API=test_api_key --name searxng-test ${{ env.TEST_TAG }}

          dump_logs() {
            echo "==== container logs ===="
            docker logs searxng-test || true
          }
          trap dump_logs ERR

          echo "Waiting for container to be ready..."
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/healthz 2>/dev/null | grep -q "OK"; then
              echo "Container is ready"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "ERROR: container did not become ready within 60 seconds"
              exit 1
            fi
            sleep 2
          done

          curl -fsS http://localhost:8080/healthz | grep "OK"
          curl -fsS --max-time 60 "http://localhost:8080/search?q=github" | grep "sidebar-end-collapsible"

          unauth_status="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "http://localhost:8080/search?q=github&format=json")"
          [ "$unauth_status" = "403" ]

          badauth_status="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 -u 'user:wrong_key' "http://localhost:8080/search?q=github&format=json")"
          [ "$badauth_status" = "403" ]

          curl -fsS --max-time 60 -u 'user:test_api_key' \
            "http://localhost:8080/search?q=github&format=json" | grep '"query"'

          bearer_out="$(curl -sS -w 'HTTPSTATUS:%{http_code}' --max-time 15 \
            -H "Authorization: Bearer test_api_key" "http://localhost:8080/search?format=json")"
          echo "$bearer_out" | grep -q '"error"'
          echo "$bearer_out" | grep -q 'HTTPSTATUS:400'

          docker rm -f searxng-test

      - name: Build and push GHCR and Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: ./
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.GITHUB_LATEST_TAG }}
            ${{ env.DOCKER_HUB_LATEST_TAG }}